{% if match.status == "cancelled" %}
    <span class="badge bg-secondary match-status">Отменена</span>
{% elif match.is_completed %}
    <span class="badge bg-success match-status match-status-done">
        Завершена
    </span>
{% elif match.is_scheduled %}
    <span class="badge bg-info text-dark match-status">
        Будет идти
    </span>
{% else %}
    <span class="badge bg-warning text-dark match-status match-status-active">
        Идет
    </span>
{% endif %}
