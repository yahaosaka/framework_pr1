<article class="card game-card mb-3">
    <div class="card-body">
        <h2 class="card-title h4">{{ game.title|default:"Без названия" }}</h2>
        <p class="card-text">
            Жанр: {{ game.genre|default:"не указан"|capfirst }} ·
            игроков: от {{ game.min_players }} до {{ game.max_players }}
        </p>
        <a href="{% url 'games:detail' game.id %}" class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>
