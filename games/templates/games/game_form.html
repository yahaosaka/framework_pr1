{% extends "base.html" %}
{% block title %}Редактировать игру{% endblock %}
{% block content %}
<h1>Редактировать игру</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Сохранить</button>
</form>
<a class="btn btn-outline-secondary mt-3" href="{% url 'games:detail' game.pk %}">К игре</a>
{% endblock %}
