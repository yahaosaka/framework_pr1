{% extends "base.html" %}

{% block title %}Игры – Учет партий{% endblock %}

{% block content %}
    <h1>Настольные игры</h1>
    <p>Всего игр: {{ games|length }}</p>

    {% for game in games %}
        {% include "games/includes/game_card.html" %}
    {% empty %}
        <p>Игры не найдены.</p>
    {% endfor %}
{% endblock %}
